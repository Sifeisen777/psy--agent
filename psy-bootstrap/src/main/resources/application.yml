server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: psy-agent
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  lifecycle:
    timeout-per-shutdown-phase: 20s

  # ---- Spring AI：OpenAI 兼容协议 ----
  # 单一配置源：一律由 psy.ai.* 派生。曾经这里和 psy.ai.api-key 各写一份，
  # 结果用户在 local 里只填了 psy.ai.api-key，此处仍取到 sk-placeholder，
  # 启动毫无异常、一调用就 401 —— 典型的"双轨配置"事故。
  ai:
    openai:
      api-key: ${psy.ai.api-key}
      base-url: ${psy.ai.base-url}
      chat:
        options:
          model: ${psy.ai.model}
          temperature: 0.7
    retry:
      max-attempts: 3
      backoff:
        initial-interval: 1s
        multiplier: 2

# ---- 业务自定义配置 ----
psy:
  ai:
    # 唯一入口：这里填真 Key 就生效；留默认值 sk-placeholder 即走 Mock
    api-key: ${DEEPSEEK_API_KEY:sk-placeholder}
    base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
    model: ${DEEPSEEK_MODEL:deepseek-chat}
    timeout-seconds: 30

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    com.psyagent: DEBUG
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"
