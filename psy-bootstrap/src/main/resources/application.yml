server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: psy-agent
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  lifecycle:
    timeout-per-shutdown-phase: 20s

  # ---- Spring AI：OpenAI 兼容协议 ----
  # 这里给的是占位 Key，目的只是让自动配置能正常初始化 Bean；
  # 真正是否调用模型由 psy.ai.api-key 决定（见 ApiKeyPresentCondition）。
  ai:
    openai:
      api-key: ${DEEPSEEK_API_KEY:sk-placeholder}
      base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
      chat:
        options:
          model: ${DEEPSEEK_MODEL:deepseek-chat}
          temperature: 0.7
    retry:
      max-attempts: 3
      backoff:
        initial-interval: 1s
        multiplier: 2

# ---- 业务自定义配置 ----
psy:
  ai:
    # 留空 => Mock 模式，项目照样启动
    api-key: ${DEEPSEEK_API_KEY:}
    base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
    model: ${DEEPSEEK_MODEL:deepseek-chat}
    timeout-seconds: 30

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    com.psyagent: DEBUG
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"
