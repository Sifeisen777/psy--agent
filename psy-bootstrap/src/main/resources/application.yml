server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: psy-agent
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  lifecycle:
    timeout-per-shutdown-phase: 20s

  # SSE 异步请求：容器层超时，需 ≥ SseEmitter 自身设置的 120s，否则会被 Tomcat 先掐断
  mvc:
    async:
      request-timeout: 130000

  # 数据库版本化迁移：启动时自动执行 classpath:db/migration 下未应用的脚本
  # baseline-on-migrate：允许对已有数据的库首次接入 Flyway
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    validate-on-migrate: true

  # ---- Spring AI：OpenAI 兼容协议 ----
  # 单一配置源：一律由 psy.ai.* 派生。曾经这里和 psy.ai.api-key 各写一份，
  # 结果用户在 local 里只填了 psy.ai.api-key，此处仍取到 sk-placeholder，
  # 启动毫无异常、一调用就 401 —— 典型的"双轨配置"事故。
  ai:
    openai:
      api-key: ${psy.ai.api-key}
      base-url: ${psy.ai.base-url}
      chat:
        options:
          model: ${psy.ai.model}
          temperature: 0.7
    retry:
      max-attempts: 3
      backoff:
        initial-interval: 1s
        multiplier: 2

# ---- 持久层 ----
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: assign_id
      # 逻辑删除：所有查询自动追加 deleted = 0，删除变成 UPDATE
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# ---- 业务自定义配置 ----
psy:
  ai:
    # 唯一入口：这里填真 Key 就生效；留默认值 sk-placeholder 即走 Mock
    api-key: ${DEEPSEEK_API_KEY:sk-placeholder}
    base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
    model: ${DEEPSEEK_MODEL:deepseek-chat}
    timeout-seconds: 30
  # 对话接口限流：单人每分钟最多 10 次，防刷、防误触、也防模型账单失控
  rate-limit:
    chat-per-minute: ${CHAT_RATE_LIMIT:10}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    com.psyagent: DEBUG
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"
